services:
  - type: web
    name: ma-industries
    runtime: static
    buildCommand: node scripts/site/build.mjs
    staticPublishPath: ./dist
    envVars:
      - key: SITE_URL
        value: https://maindustries.in
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/catalogues/MA-Industries-Paper-Catalogue.pdf
        name: Content-Disposition
        value: 'attachment; filename="MA-Industries-Paper-Catalogue.pdf"'
    routes:
      - type: redirect
        source: /product-duplex-paper.html
        destination: "/products.html?category=boards#paper-duplex-paper"
